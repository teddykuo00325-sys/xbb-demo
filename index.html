<style>
/* 手機＝全螢幕 App，桌機＝手機框＋右側規格面板。
   品牌色：靛藍 #293B70、杏橘 #F4975A（XiaoBenBen-Logo-B-v1 定案）。 */
:root{
  --paper:#EFEFEC; --surface:#FFFFFF; --surface-2:#F5F5F1; --line:#DCDCD4;
  --ink:#1A1C22; --muted:#6C7080;
  --indigo:#293B70; --indigo-soft:#DDE2F0;
  --apricot:#F4975A; --apricot-soft:#FDEADB; --on-apricot:#2A1403;
  --calm:#51708E; --calm-soft:#DFE8F0;
  --font-zh:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101218; --surface:#191C25; --surface-2:#222633; --line:#2E3342;
    --ink:#E8EAF0; --muted:#949AAD;
    --indigo:#93A6E0; --indigo-soft:#1C2340;
    --apricot:#F4975A; --apricot-soft:#3A2817; --on-apricot:#2A1403;
    --calm:#86A6C4; --calm-soft:#1D2A36;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101218; --surface:#191C25; --surface-2:#222633; --line:#2E3342;
  --ink:#E8EAF0; --muted:#949AAD;
  --indigo:#93A6E0; --indigo-soft:#1C2340;
  --apricot:#F4975A; --apricot-soft:#3A2817; --on-apricot:#2A1403;
  --calm:#86A6C4; --calm-soft:#1D2A36;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-zh); line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 32px;
}
h1,h2{margin:0; font-weight:700; text-wrap:balance}
p{margin:0}
button{font:inherit; cursor:pointer; border:1px solid transparent; border-radius:10px}
button:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
button[disabled]{opacity:.42; cursor:not-allowed}

/* ---------- 桌機外框 ---------- */
.masthead{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 16px;
  padding-block:20px 14px; border-bottom:1px solid var(--line);
  max-width:1160px; margin-inline:auto;
}
.masthead h1{font-size:1.1rem}
.masthead .en{font-family:var(--font-mono); font-size:.7rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--indigo)}
.masthead .meta{margin-left:auto; font-family:var(--font-mono); font-size:.7rem; color:var(--muted)}
.lede{max-width:1160px; margin:14px auto 0; font-size:.88rem; color:var(--muted); max-inline-size:72ch}
.wrap{max-width:1160px; margin:24px auto 0; display:grid;
  grid-template-columns:minmax(0,330px) minmax(0,1fr); gap:28px; align-items:start}
.stage{display:flex; flex-direction:column; gap:14px; align-items:center}

.device{
  width:min(312px,100%); height:640px; background:var(--surface);
  border:1px solid var(--line); border-radius:30px; padding:11px 10px;
  box-shadow:0 14px 34px -18px rgba(16,18,24,.5); display:flex; flex-direction:column;
}
.notch{width:70px; height:5px; border-radius:3px; background:var(--line); margin:1px auto 9px; flex:none}

/* ---------- App 本體 ---------- */
.app{
  flex:1; min-height:0; background:var(--surface-2);
  border:1px solid var(--line); border-radius:19px;
  display:flex; flex-direction:column; overflow:hidden; position:relative;
}
.appbar{
  flex:none; display:flex; align-items:center; gap:8px;
  padding:10px 14px; border-bottom:1px solid var(--line); background:var(--surface);
}
.appbar .wordmark{font-size:.84rem; font-weight:700; letter-spacing:.04em; color:var(--indigo)}
.appbar .date{margin-left:auto; font-family:var(--font-mono); font-size:.68rem; color:var(--muted)}
.appbar .cog{
  background:none; border:none; padding:2px 4px; font-size:.68rem;
  color:var(--muted); text-decoration:underline; text-underline-offset:3px;
}
.view{flex:1; min-height:0; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px}
.view.center{justify-content:center}
.navbar{
  flex:none; display:grid; grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line); background:var(--surface);
}
.navbar button{
  background:none; border:none; border-radius:0; padding:9px 4px;
  font-size:.72rem; color:var(--muted); display:flex; flex-direction:column; gap:1px; align-items:center;
}
.navbar button.on{color:var(--indigo); font-weight:700; box-shadow:inset 0 2px 0 var(--indigo)}

/* ---------- 元件 ---------- */
.brand{text-align:center; display:flex; flex-direction:column; gap:2px; margin-bottom:6px}
.brand b{font-size:1.5rem; letter-spacing:.06em; color:var(--indigo)}
.brand span{font-size:.72rem; color:var(--muted)}
.ask{font-size:1.06rem; font-weight:700; text-align:center; line-height:1.5}
.say{font-size:.92rem; text-align:center; line-height:1.65}
.say em{font-style:normal; font-weight:700; color:var(--indigo)}
.tiny{font-size:.7rem; color:var(--muted); text-align:center; line-height:1.55}
.step{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.1em; color:var(--muted); text-align:center}

input[type=text],textarea{
  width:100%; font:inherit; font-size:.9rem; padding:10px 12px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); resize:none;
}
input[type=text]{text-align:center}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--indigo); outline-offset:1px}

.btn{width:100%; padding:11px 12px; font-size:.86rem; font-weight:500;
  background:var(--surface); color:var(--ink); border-color:var(--line); transition:transform .1s ease}
.btn:not([disabled]):active{transform:translateY(1px)}
.btn.primary{background:var(--indigo); color:#FFF; border-color:var(--indigo);
  font-size:.95rem; font-weight:700; padding:13px 12px}
:root[data-theme="dark"] .btn.primary{color:#101218}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn.primary{color:#101218} }
.btn.interest{background:var(--indigo-soft); border-color:var(--indigo)}
.btn.fear{background:var(--calm-soft); border-color:var(--calm)}
.btn.play{background:var(--apricot); color:var(--on-apricot); border-color:var(--apricot);
  font-size:1rem; font-weight:700; padding:15px 12px; letter-spacing:.08em}
.btn.play.on{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.12)}}
.linkbtn{align-self:center; background:none; border:none; padding:4px 2px;
  font-size:.72rem; color:var(--muted); text-decoration:underline; text-underline-offset:3px}
.linkbtn:hover{color:var(--indigo)}

.card{background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:13px 14px; display:flex; flex-direction:column; gap:7px}
.card.rec{border-color:var(--indigo); animation:rise .4s cubic-bezier(.2,.8,.3,1) both}
.card.rec.avoid{border-color:var(--calm)}
.card b{font-size:.88rem}
.card .sub{font-family:var(--font-mono); font-size:.68rem; color:var(--muted)}
.card .hd{font-size:.7rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--indigo)}
@keyframes rise{from{opacity:0; transform:translateY(16px)}}
@media (prefers-reduced-motion:reduce){ .card.rec{animation:none} .btn.play.on{animation:none} .btn:active{transform:none} }

.row{display:flex; gap:9px; align-items:center}
.row .grow{flex:1; min-width:0}
.pill{font-family:var(--font-mono); font-size:.66rem; padding:2px 7px; border-radius:5px; border:1px solid; white-space:nowrap}
.pill.interest{background:var(--indigo-soft); border-color:var(--indigo)}
.pill.fear{background:var(--calm-soft); border-color:var(--calm)}
.pill.none{background:var(--surface-2); border-color:var(--line); color:var(--muted)}
.pill.absent{background:var(--apricot-soft); border-color:var(--apricot)}
.pill.note{background:var(--surface-2); border-color:var(--line); color:var(--muted)}

.banner{display:flex; flex-direction:column; gap:3px; padding:9px 12px; flex:none;
  background:var(--apricot-soft); border:1px solid var(--apricot); border-radius:9px}
.banner b{font-size:.8rem}
.banner span{font-size:.72rem; color:var(--muted); line-height:1.45}

.badge{margin-left:5px; font-size:.6rem; padding:0 5px; border-radius:4px; vertical-align:1px;
  background:var(--apricot-soft); border:1px solid var(--apricot); color:var(--ink); font-weight:500}
.carerow{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:9px;
  background:var(--surface-2); border:1px solid var(--line)}
.carerow .grow{display:flex; flex-direction:column; min-width:0}
.carerow b{font-size:.86rem}
.carest{font-family:var(--font-mono); font-size:.68rem; white-space:nowrap; color:var(--muted)}
.carerow.over{border-color:var(--apricot)}
.carerow.over .carest{color:var(--apricot); font-weight:500}
.carerow.due,.carerow.soon{border-color:var(--indigo)}
.carerow.due .carest,.carerow.soon .carest{color:var(--indigo); font-weight:500}
.careform{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.careform input,.careform select,input.mini{width:100%; font:inherit; font-size:.82rem; padding:8px 9px;
  border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); min-width:0; text-align:left}
.careform .btn{grid-column:1 / -1}
input.mini{width:auto; max-width:9.5rem; padding:5px 7px; font-size:.74rem}

.askbox{display:flex; flex-direction:column; gap:6px; padding:11px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:9px}
.askbox b{font-size:.88rem}

.sumdoc{background:var(--surface-2); border:1px solid var(--line);
  border-radius:9px; padding:13px; display:flex; flex-direction:column; gap:6px}
.sumhd{font-size:.86rem; font-weight:700; padding-bottom:7px; border-bottom:1px solid var(--line)}
.sumrow{display:flex; justify-content:space-between; font-size:.82rem}
.sumrow span{color:var(--muted)}
.sumsec{font-family:var(--font-mono); font-size:.64rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); margin-top:7px}
.sumnote{font-size:.8rem; line-height:1.55; display:flex; gap:8px}
.sumnote span{font-family:var(--font-mono); font-size:.7rem; color:var(--muted); flex:none}
.summiss{font-size:.76rem; color:var(--apricot); line-height:1.5; margin-top:5px}
.sumfoot{font-size:.72rem; color:var(--muted); line-height:1.5;
  border-top:1px solid var(--line); padding-top:7px; margin-top:4px}

.paywall{display:flex; flex-direction:column; gap:8px; padding:14px;
  border:1px solid var(--indigo); border-radius:10px; background:var(--indigo-soft)}
.paywall b{font-size:.92rem}

.animcv{width:100%; border-radius:10px; display:block; background:#0D1840}
.lockbox{display:flex; flex-direction:column; gap:6px; padding:14px;
  border:1px dashed var(--line); border-radius:10px; background:var(--surface-2); text-align:center}
.lockbox b{font-size:.9rem}

.favlist{display:flex; flex-direction:column; gap:7px}
.favrow{display:flex; align-items:center; gap:8px; padding:7px 10px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:9px}
.favrow b{font-size:.86rem; font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.miniplay{flex:none; width:30px; height:30px; border-radius:50%; font-size:.72rem;
  background:var(--apricot); color:var(--on-apricot); border-color:var(--apricot)}
.heart{flex:none; background:none; border:none; padding:2px 5px; font-size:1rem;
  color:var(--line); line-height:1}
.heart.on{color:var(--indigo)}
.heart:hover{color:var(--indigo)}

.chips{display:flex; flex-wrap:wrap; gap:6px}
.chipbtn{padding:6px 11px; font-size:.78rem; border-radius:999px;
  background:var(--surface-2); border:1px solid var(--line); color:var(--ink)}
.chipbtn.on{background:var(--indigo-soft); border-color:var(--indigo); font-weight:700}
.chipbtn[disabled]{opacity:1}
.chipbtn[disabled]:not(.on){opacity:.5}

.bar{height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden; border:1px solid var(--line)}
.bar i{display:block; height:100%; background:var(--indigo)}
.empty{font-size:.84rem; color:var(--muted); line-height:1.7; text-align:center}

/* 審閱面板 */
.sheet{
  position:absolute; inset:auto 0 0 0; background:var(--surface);
  border-top:1px solid var(--line); padding:14px; display:flex; flex-direction:column; gap:8px;
  box-shadow:0 -10px 24px -16px rgba(16,18,24,.6); z-index:5;
}
.sheet .hd{font-family:var(--font-mono); font-size:.64rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted)}
.sheet button{padding:8px 10px; font-size:.78rem; background:var(--surface-2);
  border-color:var(--line); color:var(--ink)}

/* ---------- 右欄（桌機才有） ---------- */
.panel{display:flex; flex-direction:column; gap:14px; min-width:0}
.pcard{background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:16px 17px; min-width:0}
.pcard>h2{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.13em;
  text-transform:uppercase; color:var(--indigo); margin-bottom:11px}
.statebar{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.chip{font-family:var(--font-mono); font-size:.75rem; font-weight:500; padding:3px 9px;
  border-radius:6px; background:var(--indigo-soft); color:var(--ink); border:1px solid var(--indigo)}
.kv{font-family:var(--font-mono); font-size:.72rem; color:var(--muted)}
.tablewrap{overflow-x:auto; margin-inline:-17px; padding-inline:17px}
table{border-collapse:collapse; width:100%; min-width:420px; font-family:var(--font-mono); font-size:.72rem}
th,td{text-align:left; padding:5px 9px 5px 0; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-weight:500; color:var(--muted); font-size:.64rem; letter-spacing:.08em; text-transform:uppercase}
td.n{font-variant-numeric:tabular-nums; color:var(--muted)}
.rules{display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none}
.rules li{font-size:.85rem; line-height:1.6; padding-left:14px; position:relative; max-inline-size:68ch}
.rules li::before{content:""; position:absolute; left:0; top:.62em; width:5px; height:5px;
  border-radius:1px; background:var(--indigo)}
.rules li.no::before{background:var(--calm)}
.note{font-size:.79rem; color:var(--muted); line-height:1.65; border-left:2px solid var(--line);
  padding-left:11px; margin-top:11px; max-inline-size:66ch}
code{font-family:var(--font-mono); font-size:.88em; background:var(--surface-2); padding:1px 5px; border-radius:4px}
footer{max-width:1160px; margin:30px auto 0; padding-top:16px; border-top:1px solid var(--line);
  font-size:.77rem; color:var(--muted); line-height:1.7; max-inline-size:76ch}

/* ---------- 手機：全螢幕 App ---------- */
@media (max-width:880px){
  body{padding:0}
  .masthead,.lede,.panel,footer{display:none}
  .wrap{display:block; margin:0; height:100%; max-width:none}
  .stage{height:100%; gap:0}
  .device{width:100%; height:100%; border:none; border-radius:0; padding:0; box-shadow:none}
  .notch{display:none}
  .app{border:none; border-radius:0}
  .appbar{padding-left:max(14px,env(safe-area-inset-left,0px));
          padding-right:max(14px,env(safe-area-inset-right,0px))}
  .view{padding-left:max(18px,env(safe-area-inset-left,0px));
        padding-right:max(18px,env(safe-area-inset-right,0px)); padding-top:20px; padding-bottom:20px}
  .sheet{padding-left:max(16px,env(safe-area-inset-left,0px));
         padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ask{font-size:1.2rem}
  .say{font-size:1rem}
  .btn{padding:14px 12px; font-size:.95rem}
  .btn.primary{padding:16px 12px; font-size:1.02rem}
  .btn.play{padding:19px 12px; font-size:1.1rem}
}
</style>

  <h1>毛孩小本本 In Paw AI</h1>
  <span class="en">Trial Prototype</span>
  <span class="meta">2026-11-04</span>
</header>

<p class="lede">可試用的網頁原型。手機開啟是全螢幕 App，走完首次啟動後接到今日卡，每天一個新聲音，紀錄會累積。資料存在你自己的手機本機，關掉再開還在，別人看不到。右欄的規格面板只在桌機顯示。</p>

<footer>
  聲音是 Web Audio 合成的示意音，已套上與規格相同的音量上限（正式版為 3–5 秒實錄，授權來源未定，見待確認清單 E2）。原型不支援錄音，「說一句」只做打字；正式版是語音優先。資料只存在本機瀏覽器，沒有任何東西上傳。
</footer>

<script>
/* ===================== 聲音：參數化合成 ===================== */
const CAP = 0.17;
let ac = null;
const actx = () => (ac = ac || new (window.AudioContext || window.webkitAudioContext)());
function noiseBuf(t, c){ const n = Math.floor(c.sampleRate*t), b = c.createBuffer(1,n,c.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return b; }
function env(g,peak,t0,a,d){ g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(Math.min(peak,CAP),t0+a); g.gain.exponentialRampToValueAtTime(.0008,t0+a+d); }

const ARCH = {
  scrape(c,t0,p,dst){
    const s=c.createBufferSource(); s.buffer=noiseBuf(p.len,c);
    const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=p.q||7;
    bp.frequency.setValueAtTime(p.f0,t0);
    bp.frequency.exponentialRampToValueAtTime(p.f1,t0+p.len*.5);
    bp.frequency.exponentialRampToValueAtTime(p.f0*1.5,t0+p.len);
    const g=c.createGain(); env(g,.16,t0,.04,p.len*.9);
    s.connect(bp).connect(g).connect(dst); s.start(t0); s.stop(t0+p.len+.1);
    (p.ring||[]).forEach((f,i)=>{ const o=c.createOscillator(),og=c.createGain();
      o.type="triangle"; o.frequency.value=f; env(og,.05-i*.018,t0+p.len*.45,.01,.5);
      o.connect(og).connect(dst); o.start(t0+p.len*.45); o.stop(t0+p.len+.1); });
  },
  bursts(c,t0,p,dst){
    for(let k=0;k<p.n;k++){ const s=c.createBufferSource(); s.buffer=noiseBuf(.2,c);
      const f=c.createBiquadFilter(); f.type=p.lp?"lowpass":"highpass"; f.frequency.value=p.f+k*(p.step||0);
      const g=c.createGain(), st=t0+k*p.gap; env(g,p.amp||.11,st,.012,p.dec||.13);
      s.connect(f).connect(g).connect(dst); s.start(st); s.stop(st+.22); }
  },
  ping(c,t0,p,dst){
    for(let r=0;r<p.n;r++) p.parts.forEach((f,i)=>{ const o=c.createOscillator(),g=c.createGain();
      o.type=i?"sine":"triangle"; o.frequency.value=f;
      env(g,(p.amp||.14)/(i+1.4),t0+r*p.gap,.004,p.dec||.42);
      o.connect(g).connect(dst); o.start(t0+r*p.gap); o.stop(t0+r*p.gap+(p.dec||.42)+.1); });
  },
  mew(c,t0,p,dst){
    const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
    o.type="sawtooth"; lp.type="lowpass"; lp.frequency.value=p.lp||2400; lp.Q.value=3;
    o.frequency.setValueAtTime(p.a,t0);
    o.frequency.linearRampToValueAtTime(p.b,t0+p.len*.25);
    o.frequency.linearRampToValueAtTime(p.c0,t0+p.len*.85);
    const v=c.createOscillator(),vg=c.createGain(); v.frequency.value=p.vib||17; vg.gain.value=p.vibd||26;
    v.connect(vg).connect(o.frequency);
    env(g,.13,t0,.07,p.len*.85);
    o.connect(lp).connect(g).connect(dst);
    o.start(t0); v.start(t0); o.stop(t0+p.len); v.stop(t0+p.len);
  },
  chirp(c,t0,p,dst){
    for(let k=0;k<p.n;k++){ const st=t0+k*p.gap,o=c.createOscillator(),g=c.createGain();
      o.type="sine"; o.frequency.setValueAtTime(p.a,st);
      o.frequency.exponentialRampToValueAtTime(p.b,st+p.up);
      o.frequency.exponentialRampToValueAtTime(p.c0,st+p.up*2.6);
      env(g,p.amp||.1,st,.01,p.dec||.14);
      o.connect(g).connect(dst); o.start(st); o.stop(st+p.gap); }
  },
  rumble(c,t0,p,dst){
    const o=c.createOscillator(),g=c.createGain(),am=c.createOscillator(),ag=c.createGain();
    o.type="sine"; o.frequency.value=p.f; am.frequency.value=p.rate; ag.gain.value=.5;
    am.connect(ag).connect(g.gain);
    env(g,.14,t0,.12,p.len);
    o.connect(g).connect(dst); o.start(t0); am.start(t0); o.stop(t0+p.len+.2); am.stop(t0+p.len+.2);
  },
  thunk(c,t0,p,dst){
    const s=c.createBufferSource(); s.buffer=noiseBuf(.3,c);
    const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=p.f; lp.Q.value=6;
    const g=c.createGain(); env(g,.15,t0,.008,.3);
    s.connect(lp).connect(g).connect(dst); s.start(t0); s.stop(t0+.35);
    const o=c.createOscillator(),og=c.createGain(); o.type="sine"; o.frequency.value=p.hum||110;
    env(og,.05,t0+.1,.05,p.len||.8); o.connect(og).connect(dst); o.start(t0+.1); o.stop(t0+1.1);
  }
};

/* master：單音修正 → 限幅器 → 輸出。這才是真正的硬上限。 */
function bus(c){
  const trim = c.createGain();
  const lim = c.createDynamicsCompressor();
  lim.threshold.value = -20; lim.knee.value = 0; lim.ratio.value = 20;
  lim.attack.value = 0.002; lim.release.value = 0.08;
  // 限幅器把各音峰值拉齊到 ~0.49，這道衰減把它壓回 CAP 以下（實測 max 0.163）
  const out = c.createGain(); out.gain.value = 0.33;
  trim.connect(lim).connect(out).connect(c.destination);
  return trim;
}
function playSound(id){
  const c = actx(); if (c.state === "suspended") c.resume();
  const s = byId(id), b = bus(c);
  b.gain.value = s.tr;
  ARCH[s.a](c, c.currentTime + .04, s.p, b);
}

/* ---- 重測：同一個聲音隔一段時間再放，反應變了沒 ---- */
function lastRecord(id){ for (let i = DB.log.length - 1; i >= 0; i--){ const r = DB.log[i];
  if (r.soundId === id && r.type !== "note" && r.reaction !== "absent") return r; } return null; }
function isRetest(id){ const r = lastRecord(id); return !!r && daysUntil(r.date) <= -RETEST_DAYS; }
function retestPairs(){
  const by = {};
  DB.log.forEach(r => { if (r.type === "note" || r.reaction === "absent") return;
    (by[r.soundId] = by[r.soundId] || []).push(r); });
  return Object.keys(by).map(id => { const a = by[id], f = a[0], l = a[a.length - 1];
    return a.length >= 2 && daysUntil(l.date) - daysUntil(f.date) >= RETEST_DAYS ? { id, name:f.name, f, l } : null; })
    .filter(Boolean);
}

function careStatus(it){
  if (!it.next) return { cls:"none", txt:"下次日期待確認" };
  const n = daysUntil(it.next);
  if (n < 0)        return { cls:"over", txt:"逾期 " + (-n) + " 天" };
  if (n === 0)      return { cls:"due",  txt:"今天到期" };
  if (n <= it.lead) return { cls:"soon", txt:n + " 天後" };
  return { cls:"ok", txt:md(it.next) + "（" + n + " 天後）" };
}

function addNote(text, quick){
  writeLog({ type:"note", note:text, quick:!!quick, session:"daily" });
  const rec = DB.log[DB.log.length - 1];
  rollDay();
  let gave = null;
  // 存滿時不給，換取次數每天上限 EARN_CAP
  if ((DB.testMode || DB.day.earned < EARN_CAP) && DB.stash.length < stashCap()){
    give(1); DB.day.earned++; gave = DB.stash[DB.stash.length - 1]; }
  UNDO = { rec, gave };
  MSG = "記下了：" + text + (gave ? "　→　換到 1 個聲音" : "");
  save(); VIEW = "today"; render();
}

   發放  免費 1／天，Pro 2／天；存滿就不發（滿了＝今天白拿，是來用掉的拉力）
   換取  寫一筆觀察 +1，兩種等級都一樣，一天最多換 2 次

   播放  每天最多 3 次，★ 不分等級 —— 這是動物安全規定，不是可以賣的東西 */
const EARN_CAP = 2, PLAY_CAP = 3;
const stashCap = () => DB.testMode ? 99 : (DB.pro ? 5 : 3);
const dailyGrant = () => DB.pro ? 2 : 1;

function nextSound(){
  const avoid = avoided();
  for (let k = 0; k < SOUNDS.length; k++){
    const s = SOUNDS[(DB.dailyIdx + k) % SOUNDS.length];
    if (!avoid.includes(s.id) && !DB.stash.includes(s.id)){ DB.dailyIdx += k + 1; return s.id; }
  }
  DB.dailyIdx++; return SOUNDS[DB.dailyIdx % SOUNDS.length].id;   // 全在手上，允許重測
}
function give(n){ let got = 0;
  for (let i = 0; i < n; i++){ if (DB.stash.length >= stashCap()) break; DB.stash.push(nextSound()); got++; }
  return got; }
function rollDay(){ const t = today();
  if (DB.day.date !== t){ DB.day = { date:t, played:0, earned:0 }; give(dailyGrant()); save(); } }
const playsLeft = () => DB.testMode ? 99 : PLAY_CAP - DB.day.played;

/* ===================== 聲音檔案動畫 =====================
   ★ 配色依據：貓是二色視覺，兩種錐細胞約 450nm（藍）與 550–560nm（黃綠），
     紅色對貓接近灰綠；視力約 20/100–20/200，動作的影響遠大於顏色。
     所以動畫只用藍與黃綠的高對比，並以「移動」為主角。
   ★ 刻意不宣稱「你的貓偏好某個顏色」—— 查不到任何對照實驗支持，
     那類說法都是從生理學外推的行銷內容。我們只說「用貓看得見的顏色畫的」。 */
const MOTIF = {
  food:   { shape:"bowl", n:1, label:"食物類" },
  hunt:   { shape:"bird", n:3, label:"狩獵類" },
  social: { shape:"ear",  n:2, label:"社交類" },
  play:   { shape:"bell", n:2, label:"玩具類" },
  env:    { shape:"leaf", n:5, label:"環境類" }
};
const collected = () => DB.favs.length + DB.customs.length;

/* 「專屬」靠的是確定性 ＋ 參數組合，不是生成式。
   同一隻貓每次打開都要長一樣，否則分享出去就不是「牠的」動畫。
   種子取自名字＋主導類別，一般程式即可，不需要任何模型。 */
const hash = s => { let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0; };
const ACCENTS = ["#CBE045", "#9FD84B", "#7FD6C0", "#DCE26A"];   // 全在貓的可見範圍

function animParams(){
  const rows = DB.log.filter(r => r.type !== "note" && r.reaction !== "absent");
  const g = {};
  rows.forEach(r => { g[r.cat] = g[r.cat] || {hit:0, all:0}; g[r.cat].all++;
    if (r.reaction === "interest") g[r.cat].hit++; });
  let top = null, best = -1;
  Object.keys(g).forEach(k => { const p = g[k].hit / g[k].all;
    if (g[k].hit > 0 && p > best){ best = p; top = k; } });
  if (!top || !MOTIF[top]) top = Object.keys(g).find(k => MOTIF[k]) || "hunt";
  return { top, hit: g[top] ? g[top].hit : 0, all: g[top] ? g[top].all : 0,
           days: new Set(DB.log.map(r => r.date)).size,
           name: DB.pet ? DB.pet.name : "牠", ts: Date.now() };
}

let animRAF = null;
function stopAnim(){ if (animRAF){ cancelAnimationFrame(animRAF); animRAF = null; } }

function drawAnim(cv, p){
  stopAnim();
  const ctx = cv.getContext("2d");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth || 280, H = Math.round(W * 0.78);
  cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const m = MOTIF[p.top] || MOTIF.hunt;
  const sd = hash((p.name || "x") + "|" + p.top);
  const pattern = sd % 3;                        // 0 橫向擺盪 1 繞圈 2 飄落
  const LIME = ACCENTS[(sd >> 4) % ACCENTS.length];
  const count = m.n + (sd >> 8) % 2;             // 同類別也會有兩種密度
  const BLUE_D = "#0D1840", BLUE_M = "#1E2F75", CAT = "#7FA3E8";
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t = still ? 0.9 : 0;

  function shape(x, y, s, kind){
    ctx.fillStyle = LIME; ctx.beginPath();
    if (kind === "bird"){ ctx.ellipse(x, y, s*1.5, s*.55, Math.sin(t*5)*.5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+s*1.2, y-s*.2, s*.5, s*.5, 0, 0, 7); }
    else if (kind === "bowl"){ ctx.arc(x, y, s, Math.PI*.1, Math.PI*.9); }
    else if (kind === "bell"){ ctx.arc(x, y, s*.9, 0, 7); }
    else if (kind === "leaf"){ ctx.ellipse(x, y, s*1.3, s*.5, t*2 + x, 0, 7); }
    else { ctx.moveTo(x-s, y+s); ctx.lineTo(x, y-s*1.2); ctx.lineTo(x+s, y+s); ctx.closePath(); }
    ctx.fill();
  }

  function frame(){
    const gr = ctx.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, BLUE_D); gr.addColorStop(1, BLUE_M);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

    const pts = [];
    for (let i = 0; i < count; i++){
      const ph = t * .9 + i * (6.28 / count);
      let x, y;
      if (pattern === 0){ x = W * (.5 + .34 * Math.sin(ph));
                          y = H * (.34 + .16 * Math.sin(ph * 1.7 + i)); }
      else if (pattern === 1){ x = W * (.5 + .3 * Math.cos(ph));
                               y = H * (.36 + .2 * Math.sin(ph)); }
      else { x = W * (.18 + .64 * ((i + 1) / (count + 1)) + .06 * Math.sin(ph * 2));
             y = H * (((t * .22 + i / count) % 1) * .62 + .06); }
      pts.push([x, y]); shape(x, y, Math.max(7, W * .035), m.shape);
    }

    // 貓：耳朵朝向最近的移動物件 —— 這就是整個產品的隱喻
    const cx = W / 2, cy = H * .82, r = W * .14;
    const tgt = pts.reduce((a, b) => (Math.abs(b[0]-cx) < Math.abs(a[0]-cx) ? b : a), pts[0] || [cx, 0]);
    const tilt = Math.max(-.42, Math.min(.42, (tgt[0] - cx) / W * 1.6));
    ctx.fillStyle = CAT;
    [-1, 1].forEach(sd => { ctx.save(); ctx.translate(cx + sd*r*.62, cy - r*.72);
      ctx.rotate(tilt + sd*.22); ctx.beginPath();
      ctx.moveTo(-r*.34, r*.34); ctx.lineTo(0, -r*.62); ctx.lineTo(r*.34, r*.34);
      ctx.closePath(); ctx.fill(); ctx.restore(); });
    ctx.beginPath(); ctx.ellipse(cx, cy, r, r*.88, 0, 0, 7); ctx.fill();
    ctx.fillStyle = BLUE_D;
    [-1, 1].forEach(sd => { ctx.beginPath();
      ctx.ellipse(cx + sd*r*.36, cy - r*.1, r*.14, r*.19, 0, 0, 7); ctx.fill(); });

    if (still){ animRAF = null; return; }
    t += .016; animRAF = requestAnimationFrame(frame);
  }
  frame();
}

  }).join("") : `<p class="empty">這個篩選下沒有紀錄</p>`);

/* ---- 毛孩頁：基本資料 ＋ 偏好 ＋ 看診摘要 ---- */
let SUMDAYS = 14;

function shiftDate(n){ const d = new Date();
  d.setDate(d.getDate() - n + 1);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }

function summary(days){
  const from = shiftDate(days);
  const rows = DB.log.filter(r => r.date >= from);
  const snd = rows.filter(r => r.type !== "note");
  const notes = rows.filter(r => r.type === "note");
  const have = new Set(rows.map(r => r.date));
  const miss = [];
  for (let i = 0; i < days; i++){ const d = shiftDate(days - i); if (!have.has(d)) miss.push(d); }
  return { from, days, rows, snd, notes, miss, covered: have.size };
}

function catBars(rows){
  const g = {};
  rows.forEach(r => { g[r.cat] = g[r.cat] || {hit:0, all:0}; g[r.cat].all++; if (r.reaction === "interest") g[r.cat].hit++; });
  const ks = Object.keys(g).sort((a,b) => g[b].hit/g[b].all - g[a].hit/g[a].all);
  if (!ks.length) return `<span class="sub">還沒有聲音紀錄</span>`;
  return ks.map(k => { const p = Math.round(g[k].hit/g[k].all*100);
    return `<div><div class="row"><span class="grow" style="font-size:.85rem">${CATNAME[k]}</span>
      <span class="sub">${g[k].hit}/${g[k].all}　${p}%</span></div>
      <div class="bar"><i style="width:${p}%"></i></div></div>`; }).join("");
}

/* ---- 自訂錄音 ---- */
function upload(file){
  if (!file) return;
  if (file.size > MAX_UPLOAD){
    MSG = "檔案太大（" + Math.round(file.size/1024) + "KB）。原型限 300KB 以內"; render(); return; }
  const fr = new FileReader();
  fr.onerror = () => { MSG = "讀不到這個檔案"; render(); };
  fr.onload = () => {
    const c = { id:"custom_" + Date.now(), n:file.name.replace(/\.[^.]+$/,"").slice(0,20) || "自訂錄音", data:fr.result };
    DB.customs.push(c);
    try { localStorage.setItem(KEY, JSON.stringify(DB)); }
    catch(e){ DB.customs.pop(); MSG = "本機空間不足，存不下。先刪掉一個再試"; render(); return; }
    MSG = "已加入：" + c.n; render();
  };
  fr.readAsDataURL(file);
}
async function playCustom(id){
  const c = actx(); if (c.state === "suspended") await c.resume();
  const cu = DB.customs.find(x => x.id === id); if (!cu) return;
  try{
    if (!bufCache.has(id)){
      const ab = await (await fetch(cu.data)).arrayBuffer();
      bufCache.set(id, await c.decodeAudioData(ab));
    }
    const src = c.createBufferSource(); src.buffer = bufCache.get(id);
    const b = bus(c); b.gain.value = 1;     // 自訂音檔一樣走限幅器
    src.connect(b); src.start();
  } catch(e){ MSG = "這個格式播不出來，試試 m4a 或 mp3"; render(); }
}

function startOb(name){
  DB.pet = { name: name.trim(), species:"cat", createdAt: Date.now() };
  DB.ob.state = "PLAYING"; DB.ob.attempt = 1; DB.ob.replays = 0; save(); render();
}
function obPlay(){
  const s = obSound(); playSound(s.id);
  if (!DB.ob.played.includes(s.id)) DB.ob.played.push(s.id);
  PLAYING = true; save(); render();
  setTimeout(() => { PLAYING = false; DB.ob.state = "REPORTING"; save(); render(); }, 2600);
}
function obReport(r){
  const s = obSound();
  writeLog({ soundId:s.id, name:s.n, cat:s.cat, reaction:r, attempt:DB.ob.attempt, session:"onboarding" });
  const o = DB.ob;
  if (r === "interest")    o.state = "DONE_HIT";
  else if (r === "fear")   o.state = "DONE_FEAR";
  else if (r === "absent"){ o.state = "PAUSED"; o.pausedAt = today();
    o.played = o.played.filter(id => id !== s.id); }   // 牠不在＝這個聲音沒測到，回來時重放同一個
  else if (o.attempt >= 3) o.state = "DONE_NONE";
  else { o.attempt++; o.replays = 0; o.state = "PLAYING"; }
  save(); render();
}
function dailyPlay(){
  const idx = DB.pro ? PICK : 0;
  const s = byId(DB.stash[idx]);
  playSound(s.id); PLAYING = true; render();
  setTimeout(() => {
    PLAYING = false;
    const v = el("view"); v.className = "view center";
    v.innerHTML = `<p class="ask"><em>${who()}</em> 對「${esc(s.n)}」有反應嗎？</p>
      <button type="button" class="btn interest" data-d="interest">牠有反應，轉頭或靠過來</button>
      <button type="button" class="btn fear" data-d="fear">牠被嚇到，躲開了</button>
      <button type="button" class="btn" data-d="none">沒反應</button>
      <button type="button" class="btn" data-d="absent">牠不在旁邊</button>`;
    v.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => {
      const prev = isRetest(s.id) ? lastRecord(s.id) : null;
      writeLog({ soundId:s.id, name:s.n, cat:s.cat, reaction:b.dataset.d, session:"daily" });
      rollDay(); DB.day.played++; DB.stash.splice(idx, 1); PICK = 0;
      if (prev) MSG = "重測：" + md(prev.date) + " " + RLG[prev.reaction] + " → 今天 " + RLG[b.dataset.d] +
        (prev.reaction === b.dataset.d ? "，跟上次一樣" : "，反應變了，記下來了");
      VIEW = "today"; save(); render();
    }));
    panel();
  }, 2600);
}

    DB.favs = DB.favs.filter(id => live.has(id));      // 愛心是從示範紀錄來的就一起清掉
    save(); sh.hidden = true;
    MSG = "清掉 " + (before - DB.log.length) + " 筆示範資料，你自己記的都還在"; render(); };
  el("cl").onclick = () => sh.hidden = true;
  el("rs2").onclick = () => { DB = FRESH(); VIEW = "ob"; save(); sh.hidden = true; render(); };
  el("jf").onclick = () => { seed("fear"); sh.hidden = true; render(); };
  el("jn").onclick = () => { seed("none"); sh.hidden = true; render(); };
});
/* 載入 14 天示範資料 —— 審閱用，不然偏好、摘要、動畫全都是空殼。
   刻意空掉三天，好讓摘要的「缺漏天數」那一行真的出現。 */
function seedDemo(){
  const name = (DB.pet && DB.pet.name) || "小花";
  DB.pet = { name, species:"cat", createdAt: Date.now() };
  DB.log = []; DB.favs = []; DB.stash = []; DB.anims = []; DB.customs = [];
  const pool = ["snd_bird_chirp","snd_mouse","snd_sparrow","snd_can_open","snd_bag_tear",
                "snd_kitten_mew","snd_bell","snd_bowl_tap","snd_insect","snd_purr","snd_fridge"];
  const notes = ["今天吃得比較少，睡了一整個下午", "半夜一直叫，可能是想出去",
                 "貓砂用量比平常多", "對窗外的鳥叫反應很大",
                 "今天很黏人，一直跟著我", "吐了一次毛球"];
  let ni = 0;
  for (let d = 14; d >= 1; d--){
    if (d === 11 || d === 8 || d === 4) continue;          // 刻意空三天
    const date = shiftDate(d), s = byId(pool[(14 - d) % pool.length]);
    // 明確的反應表：有反應的剛好 6 種（滿足動畫解鎖門檻），狩獵類 7/9 最高，第 5 天呼嚕聲被嚇到
    //   14 鳥 13 老鼠 12 麻雀 10 撕飼料袋 9 幼貓 7 敲碗 6 蟲 5 呼嚕 3 鳥 2 老鼠 1 麻雀
    const r = ({ 14:"interest", 13:"interest", 12:"none", 10:"interest", 9:"interest", 7:"none",
                 6:"interest", 5:"fear", 3:"interest", 2:"interest", 1:"interest" })[d] || "none";
    DB.log.push({ ts: Date.now() - d*864e5, date, soundId:s.id, name:s.n, cat:s.cat,
                  reaction:r, session:"daily", demo:true });
    if (d % 3 === 0 && ni < notes.length)
      DB.log.push({ ts: Date.now() - d*864e5 + 1e3, date, type:"note",
                    note: notes[ni++], session:"daily", demo:true });
  }
  // 兩組重測：鳥叫反應變了、老鼠一致 —— 毛孩頁的重測對照才有東西看
  [["snd_bird_chirp", 1, "none"], ["snd_mouse", 2, "interest"]].forEach(([id, d, r]) => { const s = byId(id);
    DB.log.push({ ts: Date.now() - d*864e5 + 2e3, date: shiftDate(d), soundId:id, name:s.n, cat:s.cat,
                  reaction:r, session:"daily", demo:true }); });
  DB.log.sort((a, b) => a.ts - b.ts);
  // 疫苗驅蟲：一個快到期、一個逾期、一筆歷史
  DB.care = [ { id:"c1", kind:"疫苗", name:"三合一", next:plus(2), lead:3, on:true, demo:true },
              { id:"c2", kind:"驅蟲", name:"體內外驅蟲", next:plus(-3), lead:1, on:true, demo:true } ];
  DB.careHist = [ { date:shiftDate(40), kind:"疫苗", name:"狂犬病", demo:true } ];
  DB.favs = [...new Set(DB.log.filter(r => r.reaction === "interest").map(r => r.soundId))].slice(0, 6);
  DB.obDone = true; DB.day = { date: today(), played: 0, earned: 0 };
  give(3); save();
}

function seed(kind){
  DB = FRESH(); DB.pet = { name:"小花", species:"cat", createdAt:Date.now() };
  if (kind === "fear"){ const s = OB_POOL[0];
    writeLog({ soundId:s.id, name:s.n, cat:s.cat, reaction:"fear", attempt:1, session:"onboarding" });
    DB.ob.state = "DONE_FEAR"; }
  else { OB_POOL.forEach((s,i) =>
      writeLog({ soundId:s.id, name:s.n, cat:s.cat, reaction:"none", attempt:i+1, session:"onboarding" }));
    DB.ob.attempt = 5; DB.ob.state = "DONE_NONE"; }
  save();
}

function panel(){
  const st = DB.obDone ? VIEW : DB.ob.state;
  let b = `<span class="chip">${st}</span>`;
  if (DB.pet) b += `<span class="kv">pet.name = ${esc(DB.pet.name)}</span>`;
  if (!DB.obDone && (st === "PLAYING" || st === "REPORTING")){
    b += `<span class="kv">attempt_n = ${DB.ob.attempt}/5</span><span class="kv">${obSound().id}</span>`; }
  if (DB.obDone) b += `<span class="kv">記錄 ${new Set(DB.log.map(r=>r.date)).size} 天</span>`;
  if (DB.testMode) b += `<span class="kv">測試模式</span>`;
  el("statebar").innerHTML = b;
  el("statenote").textContent = NOTE[st] || "";

  const box = el("logbox");
  if (!DB.log.length){
    box.innerHTML = `<p class="empty" style="text-align:left">還沒有紀錄。走完流程，這裡會逐筆長出來 —— 包括「沒反應」。五個聲音都沒中的那一場，這張表仍然會有五筆。</p>`;
  } else {
    box.innerHTML = `<div class="tablewrap"><table>
      <thead><tr><th>#</th><th>date</th><th>sound</th><th>category</th><th>reaction</th><th>session</th></tr></thead>

        <td>${r.type==="note" ? "（觀察）" : esc(r.name)}</td><td>${r.type==="note" ? "—" : r.cat}</td>
        <td>${r.type==="note" ? "note" : r.reaction}</td><td>${r.session}</td></tr>`).join("")}</tbody></table></div>
      <p class="note">共 ${DB.log.length} 筆，全部存在本機瀏覽器，沒有上傳。</p>`;
  }
  el("rules").innerHTML = (RULES[st]||[]).map(r => `<li${r[1]?' class="no"':""}>${r[0]}</li>`).join("");
